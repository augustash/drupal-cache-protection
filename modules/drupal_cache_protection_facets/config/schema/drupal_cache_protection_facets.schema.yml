drupal_cache_protection_facets.settings:
  type: config_object
  label: 'Facet Protection settings'
  mapping:
    max_facets:
      type: integer
      label: 'Maximum number of facet parameters per request'
    rate_limit:
      type: integer
      label: 'Maximum faceted requests per IP within the window'
    rate_window:
      type: integer
      label: 'Rate limit window in seconds'
    extra_aliases:
      type: sequence
      label: 'Additional allowed aliases'
      sequence:
        type: string
        label: 'Alias'
    deep_threshold:
      type: integer
      label: 'Filters beyond which a request counts against the site-wide budget (0 disables)'
    deep_rate_limit:
      type: integer
      label: 'Deep faceted requests allowed site-wide within the window'
